# ================= Источник пользователей =================
source: db                    # db | excel
excel_file: db.xlsx           # при source: excel - столбцы [ID, Имя]

images_folder: images         # фото сотрудников: <id>.jpg
no_name_user: не_узнал
date_time_format: '%mD%dh%Hm%Ms%S'
log_file: log.txt
events_file: events.jsonl     # журнал проходов для страницы («кто входил и выходил»); пусто - только в памяти
events_keep: 500            # сколько последних проходов хранить
test_mode: False              # True - турникет НЕ открывается, события только в логеFalseTrue
log_view_hours: 10            #   вывод журнала за последние hh часов (от 1 до 720, по умолчанию 6).

# ================= Движок распознавания =================
mode: arcface                 # см. src/engines/ (новые движки добавляются там)

arcface:
  model_name: buffalo_l       # buffalo_l (точнее) / buffalo_s (быстрее)
  embedding_folder: arcface_embeddings
  threshold: 0.45             # косинусное сходство: чем ВЫШЕ, тем строже
  det_thresh: 0.5             # минимальная уверенность детектора лиц
  det_size: [640, 640]        # вход детектора; больше - лучше видит мелкие лица, но медленнее
  cpu_threads: 2

# ================= API системы допуска (только при source: db или test_mode: False) =================
connection:
  host: 192.168.0.15
  login: api
  #  password:       перенесен  в  run.py -p pppp
  # Камерой распознаются только сотрудники с включённым проходом по лицу (как он отмечается в Perco - см. src/utils.py).
  # Для веб-страницы запрашивается полный список сотрудников - запросом без параметров.
  # Если ваш API без параметров отдаёт не всех, задайте параметры запроса полного списка:
  # all_users_query: {имя_параметра: значение}

# ================= Камера и турникет =================
camera:
  id: rtsp://192.168.0.46/ONVIF/MediaInput?profile=3_def_profile3   # RTSP или номер USB-камеры (0)
  rtsp_transport: tcp         # tcp | udp (пусто - по умолчанию ffmpeg)
  reduce_frame: 2             # во сколько раз уменьшать кадр для поиска лиц
  frame_mode: center          # center - центр лица в зоне; full - лицо целиком в зоне
  frame_folder: frame         # снимки срабатываний
  frame_keep_days: 14         # снимки старше N суток удаляются (0 - не удалять)
  EXIT: Выход
  ENTRANCE: Вход
  FONT_PATH_RUS: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf   # для кириллицы (apt install fonts-dejavu-core)

turnstiles:
  area_1: [0.09, 0.0, 0.17, 1.0]   # ВЫХОД: x, y, w, h (доли кадра)
  area_2: [0.34, 0.0, 0.2, 1.0]    # ВХОД
  id_tur: 3                   # id контроллера турникета в Perco
  min_time_diff: 6            # не чаще раза в N сек для одного человека
  face_pass_field_id: -4      # id поля карточки сотрудника в Perco, где хранится отметка прохода по лицу (см. src/utils.py)

# ================= Трансляция в MediaMTX =================
rtsp_server:
  enabled: true
  url: "rtsp://127.0.0.1:554/test"   # MediaMTX на этой же машине
  width: 1280
  height: 720
  fps: 25
  encoder: auto               # auto | nvenc | x264
  bitrate: 3M

webrtc:
  api: http://127.0.0.1:8889  # WebRTC-порт MediaMTX (его использует веб-страница для просмотра)

# ================= Вход в веб-интерфейс =================
# Логин и пароль проверяет Perco: введённые на странице данные отправляются в Perco тем же запросом, которым программа
# входит в Perco (connection.host). Perco выдал токен - человек вошёл. Паролей в этом файле нет.
# Пока раздела auth нет, веб-интерфейс закрыт целиком; распознавание и турникет при этом работают.
auth:
  enabled: true               # false - вход не нужен (не рекомендуется; остаётся только ограничение по IP)
  provider: perco             # perco - проверяет Perco; local - пользователи из auth.users (для установок без Perco)
  allowed_logins: []          # какие учётные записи Perco допущены в веб-интерфейс, напр. ["admin", "operator"].
                              # Пусто = ЛЮБАЯ учётная запись, которую примет Perco. Здесь можно менять конфиг и
                              # включать проход по лицу, поэтому лучше перечислить нужные.
  session_hours: 12           # сколько действует вход
  max_attempts: 5             # столько неверных попыток с одного IP ...
  max_attempts_per_login: 10  # ... или столько для одного логина (с любых адресов) ...
  lockout_minutes: 10         # ... и блокировка на столько минут
  # Необязательно: АВАРИЙНЫЕ учётные записи. Действуют только пока Perco недоступен - чтобы можно было открыть
  # страницу и исправить настройки. Хеш пароля: python3 run.py --hash-password
  # users:
  #   - login: "admin"
  #     password_hash: "pbkdf2_sha256$..."
perco_events:
  enabled: true                               # false - показывать только проходы по лицу с этой камеры
  poll_sec: 5                                 # как часто читать журнал Perco
  pass_event_ids: [17]                        # какие события считать проходами
  outside_zone_id: 1                          # id зоны «Неконтролируемая территория»
  remote_event_id: 112                        # событие «Проход по команде от ДУ» (кнопка вахтёра)
  reader_directions: {1: entrance, 2: exit}   # считыватель -> направление
# ================= Веб-интерфейс =================
web:
  host: 0.0.0.0
  port: 8000
  ssl: true                   # HTTPS нужен, чтобы браузер дал доступ к веб-камере (для фото)
  cert_ips: [192.168.0.200, 192.168.0.6]   # IP сервера для самоподписанного сертификата (оба: после переезда на .6 пересоздавать не надо)
  allowed_ips: []             # кто может открыть страницу, напр. ['192.168.0.10', '192.168.0.0/24']; пусто = все
